[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cmd-unmask"
version = "0.1.0"
description = "Static command-line de-obfuscation and behavioral triage Tracer Script for SOC analysts"
readme = "GLOSSARY.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
cmd-unmask = "cmd_unmask.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
